<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Agentic VitechQ Copilot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
        }

        .container {
            width: 920px;
            margin: 40px auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 16px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            height: 110px;
        }

        button {
            margin-top: 18px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .answer {
            margin-top: 24px;
            padding: 16px;
            background: #f9fafb;
            border-left: 4px solid #2563eb;
            white-space: pre-wrap;
        }

        .error {
            border-left-color: #dc2626;
            color: #991b1b;
        }

        .meta {
            margin-top: 16px;
            font-size: 13px;
            color: #374151;
        }

        .citation {
            padding: 8px;
            margin-top: 8px;
            background: #eef2ff;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Agentic VitechQ Copilot</h1>

    <label for="tenantId">Tenant ID</label>
    <input id="tenantId" value="default_tenant"/>

    <label for="uploadedBy">Uploaded By</label>
    <input id="uploadedBy" value="sher"/>

    <label for="query">Ask your RAG system</label>
    <textarea id="query" placeholder="Example: What does the uploaded document say about claims eligibility?"></textarea>

    <button onclick="askAgent()">Ask Agent</button>

    <div id="result"></div>
</div>

<script>
    async function askAgent() {
        const resultDiv = document.getElementById("result");

        const payload = {
            tenant_id: document.getElementById("tenantId").value,
            uploaded_by: document.getElementById("uploadedBy").value,
            query: document.getElementById("query").value
        };

        resultDiv.innerHTML = "<div class='answer'>Processing agent workflow...</div>";

        try {
            const response = await fetch("http://127.0.0.1:8000/agent/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error("Agent API failed with status " + response.status);
            }

            const data = await response.json();

            let html = `
                <div class="answer">${escapeHtml(data.answer)}</div>

                <div class="meta">
                    <b>Refined Query:</b> ${escapeHtml(data.refined_query || "-")}<br/>
                    <b>Selected Source:</b> ${escapeHtml(data.selected_source || "-")}<br/>
                    <b>Validation:</b> ${escapeHtml(data.validation_status)}<br/>
                    <b>Validation Message:</b> ${escapeHtml(data.validation_message || "-")}<br/>
                    <b>Retrieved Context Count:</b> ${data.retrieved_context_count}<br/>
                    <b>Correlation ID:</b> ${escapeHtml(data.correlation_id)}
                </div>
            `;

            if (data.citations && data.citations.length > 0) {
                html += "<h3>Citations</h3>";

                data.citations.forEach((citation, index) => {
                    html += `
                        <div class="citation">
                            <b>${index + 1}.</b>
                            File: ${escapeHtml(citation.file_name || "-")} |
                            Document ID: ${escapeHtml(citation.document_id)} |
                            Chunk ID: ${escapeHtml(citation.chunk_id)} |
                            Chunk Index: ${citation.chunk_index}
                        </div>
                    `;
                });
            }

            resultDiv.innerHTML = html;

        } catch (error) {
            resultDiv.innerHTML = `
                <div class="answer error">
                    ${escapeHtml(error.message)}
                </div>
            `;
        }
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>
</body>
</html>
